<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Out | Goldman Seed Enterprise</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js?v=16" defer></script>
</head>

<body class="signout-page">

    <main class="signout-card">

        <!-- Company logo and name -->
        <a class="brand centered-brand" href="home.html">
            <img
                src="images/brand/logo.jpeg"
                alt="Goldman Seed Enterprise Logo"
                class="brand-logo"
            >

            <span class="brand-name">
                Goldman Seed Enterprise
            </span>
        </a>

        <!-- Sign-out icon -->
        <div class="signout-icon" aria-hidden="true">
            ↗
        </div>

        <!-- Sign-out message -->
        <p class="eyebrow">SEE YOU SOON</p>

        <h1>Ready to Sign Out?</h1>

        <p class="subheading">
            Are you sure you want to sign out?
            You can sign back in anytime.
        </p>

        <!-- Sign-out buttons -->
        <div class="signout-actions">

            <button
                class="primary-button"
                id="confirmSignOut"
                type="button"
            >
                Yes, Sign Me Out
            </button>

            <a class="secondary-button" href="home.html">
                Stay Signed In
            </a>

        </div>

        <!-- Footer message -->
        <p class="muted-small signout-footnote">
            Thank you for visiting Goldman Seed Enterprise.
        </p>

    </main>

</body>
</html>
